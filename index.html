      content="Independent guides, practical reviews, and comparisons of AI and SaaS software for freelancers, entrepreneurs, and small businesses."
    />
    <link rel="canonical" href="https://azmediabot.online/" />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />

      name="twitter:description"
      content="Independent guides, practical reviews, and comparisons of AI and SaaS software for freelancers, entrepreneurs, and small businesses."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://azmediabot.online/#website",
          "url": "https://azmediabot.online/",
          "name": "khmedia",
          "description": "Independent AI & SaaS software review publisher for freelancers and small businesses.",
          "inLanguage": "en-US",
          "publisher": {
            "@id": "https://azmediabot.online/#publisher"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://azmediabot.online/#publisher",
          "name": "khmedia",
          "url": "https://azmediabot.online/",
          "description": "Independent digital publishing website focused on researching, reviewing, and comparing AI tools and SaaS software for freelancers, entrepreneurs, and small businesses.",

            "Artificial Intelligence Tools",

            "Marketing Automation",
            "Email Marketing Software",
            "CRM Software",
            "Productivity Tools",

          ],
          "address": {
            "@type": "PostalAddress",

          }
        }
      ]

  <body class="bg-slate-50 text-slate-900 antialiased font-sans">

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />

      <input type="text" name="subject" />
      <textarea name="message"></textarea>

      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="checkbox" name="consent" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
